[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harmony-eaca"
version = "0.1.0"
description = "Проект «Гармония» — EACA: вычислимое ядро этики"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Сергей Лукьянов" }]
keywords = ["ethics", "eaca", "harmony", "alignment", "governance"]
dependencies = [
    # Базовые зависимости (опционально)
    # "cryptography>=42.0",  # для AES-GCM
    # "pillow>=10.0",        # для стеганографии
]

[project.optional-dependencies]
crypto = ["cryptography>=42.0"]
stego = ["pillow>=10.0"]
full = ["cryptography>=42.0", "pillow>=10.0"]
dev = ["pytest>=7.0", "pytest-cov", "black", "ruff"]

[project.scripts]
harmony = "eaca.cli:main"
harmony-build-pdf = "tools.build_pdf:main"

[project.urls]
Homepage = "https://github.com/bbcmpsu/Project-Harmony"
Repository = "https://github.com/bbcmpsu/Project-Harmony"
Issues = "https://github.com/bbcmpsu/Project-Harmony/issues"

[tool.setuptools]
packages = ["eaca", "nodes", "tests"]
package-dir = {"" = "."}

[tool.setuptools.package-data]
eaca = ["*.py"]
nodes = ["*.py"]
tests = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313", "py314"]
include = "\\.pyi?$"
exclude = """^/(
    \\.git
  | \\.venv
  | build
  | dist
)$"""

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "PIE", "T20", "PT"]
ignore = ["E501", "B008"]
exclude = ["pilots/**", "p2p_poc/**", "*.pyi"]

[tool.ruff.lint]
preview = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true
show_error_codes = true
pretty = true

# Missing stubs for optional dependencies
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "eaca.*"
strict = true

[[tool.mypy.overrides]]
module = "eaca.local_ai"
ignore_missing_imports = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "eaca.daemon"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "eaca.core"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nodes.*"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[tool.bandit]
exclude_dirs = [".venv", "tests", "tools", "docs"]
skips = ["B101", "B601"]
